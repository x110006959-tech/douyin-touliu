<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地生活诊断采集</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #172033;
        background: #f7f8fa;
      }
      header,
      section,
      footer {
        padding: 12px;
      }
      header {
        background: #fff;
        border-bottom: 1px solid #dde3ee;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      section {
        display: grid;
        gap: 8px;
      }
      .panel {
        border: 1px solid #dde3ee;
        border-radius: 8px;
        background: #fff;
        padding: 10px;
      }
      .muted {
        color: #667085;
      }
      .row {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 6px;
      }
      button {
        height: 32px;
        border: 1px solid #dde3ee;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #fff;
      }
      footer {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      pre {
        max-height: 160px;
        overflow: auto;
        border-radius: 6px;
        background: #101828;
        color: #e5e7eb;
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>本地生活诊断采集</h1>
      <div id="status" class="muted">初始化中</div>
    </header>
    <section>
      <div class="panel">
        <div class="row"><span class="muted">当前 URL</span><span id="currentUrl">-</span></div>
        <div class="row"><span class="muted">页面类型</span><span id="pageType">-</span></div>
        <div class="row"><span class="muted">可采集</span><span id="collectable">-</span></div>
        <div class="row"><span class="muted">Token</span><span id="hasToken">-</span></div>
        <div class="row"><span class="muted">任务 ID</span><span id="taskId">-</span></div>
      </div>
      <div class="panel">
        <div class="muted">本地快照</div>
        <pre id="snapshot">{}</pre>
      </div>
    </section>
    <footer>
      <button id="configBtn">登录配置</button>
      <button id="startBtn" class="primary">开始采集</button>
      <button id="refreshBtn">查看快照</button>
      <button id="uploadBtn">上传快照</button>
    </footer>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
