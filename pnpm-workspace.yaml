packages:
  - "apps/*"
  - "packages/*"

verifyDepsBeforeRun: warn
enableGlobalVirtualStore: false

overrides:
  "postcss@<8.5.23": "8.5.26"
  "body-parser@<1.20.6": "1.20.6"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "sharp"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
