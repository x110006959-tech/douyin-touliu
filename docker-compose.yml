services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ad-diagnosis-postgres
    environment:
      POSTGRES_USER: diagnosis
      POSTGRES_PASSWORD: diagnosis
      POSTGRES_DB: douyin_subject_diagnosis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-ad-diagnosis-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
