services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pxxis_test
      POSTGRES_PASSWORD: local_test_only_password
      POSTGRES_DB: pxxis_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pxxis_test -d pxxis_test"]
      interval: 2s
      timeout: 3s
      retries: 30
