name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify checked-out source is clean
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build traceable Extension artifact
        run: corepack pnpm --filter @douyin-local-life/extension release
      - run: corepack pnpm exec prisma validate
      - run: corepack pnpm prisma:generate
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm version:check
      - name: Verify production archive has no network interception
        shell: bash
        run: |
          artifact="$(find apps/extension/release -maxdepth 1 -name 'collector-v*.zip' -print -quit)"
          test -n "$artifact"
          artifact_dir="$(mktemp -d)"
          unzip -q "$artifact" -d "$artifact_dir"
          test ! -e "$artifact_dir/injected.js"
          ! grep -R -E 'window\.fetch\s*=|XMLHttpRequest|PAGE_NETWORK_CAPTURED' "$artifact_dir"
      - name: Verify validation did not mutate authored source
        run: git diff --exit-code -- . ':(exclude)apps/extension/release/**'
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: |
            apps/extension/release/collector-v*.zip
            apps/extension/release/collector-v*.zip.sha256
            apps/extension/release/release-manifest.json
