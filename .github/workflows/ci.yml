name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify checked-out source is clean
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build traceable Extension artifact
        run: corepack pnpm --filter @douyin-local-life/extension release
      - run: corepack pnpm exec prisma validate
      - run: corepack pnpm prisma:generate
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm version:check
      - name: Verify production artifact has no network interception
        shell: bash
        run: |
          test -z "$(find apps/extension/dist -name 'injected.js' -print)"
          ! grep -R -E 'window\.fetch\s*=|XMLHttpRequest|PAGE_NETWORK_CAPTURED' apps/extension/dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: |
            apps/extension/release/collector-v*.zip
            apps/extension/release/collector-v*.zip.sha256
            apps/extension/release/release-manifest.json
